apiVersion: apps/v1
kind: Deployment
metadata:
  name: payload-deployment
  labels:
    app: payload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payload
  template:
    metadata:
      labels:
        app: payload
    spec:
      containers:
      - name: payload-container
        # Your Payload CMS Docker image
        image: my-registry.io/payload-cms:latest
        ports:
          - containerPort: 3001
        env:
          - name: NODE_ENV
            value: "production"
          - name: PAYLOAD_CONFIG_PATH
            value: "/app/payload.config.ts"